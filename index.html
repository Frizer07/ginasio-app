<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <!-- NOVO: viewport-fit=cover obriga o iPhone a respeitar os limites do ecrã -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Meu Treino</title>
    
    <!-- NOVO: Ícone da App para o Ecrã Inicial do iPhone (Fundo Azul com Relâmpago) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234e80ee%22/><text x=%2250%22 y=%2250%22 font-size=%2260%22 dy=%22.35em%22 text-anchor=%22middle%22>⚡</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --bg: #000000; --card: #1c1c1e; --primary: #4e80ee; --sec: #30D158; --danger: #FF453A; --txt: #ffffff; --mut: #8e8e93; --radius: 16px; }
        
        /* NOVO: Cálculo dinâmico para afastar os elementos da barra de bateria/Dynamic Island */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--txt); 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 90px;
            padding-top: calc(env(safe-area-inset-top, 45px) + 15px); 
            -webkit-font-smoothing: antialiased;
        }

        .screen { display: none; animation: fadeUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .exercise-card { background: var(--card); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);}
        button { font-family: inherit; font-size: 16px; font-weight: 700; border: none; border-radius: 12px; padding: 14px; width: 100%; cursor: pointer; transition: transform 0.1s; margin-top: 10px; }
        button:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-success { background: var(--sec); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top:0; padding: 10px; }
        .btn-text { background: transparent; color: var(--primary); margin:0; padding: 8px; width: auto; font-size: 16px; font-weight: 600;}
        .btn-nav-ex { background: #2c2c2e; color: white; margin:0; width: auto; padding: 12px 20px; font-size: 15px; border-radius: 10px;}
        input, select { width: 100%; padding: 16px; border-radius: 12px; border: none; background: #2c2c2e; color: white; box-sizing: border-box; margin-bottom: 8px; font-size: 16px;}
        .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .history-box { font-size: 14px; color: #fff; margin-bottom: 20px; background: rgba(78, 128, 238, 0.15); padding: 14px; border-radius: 10px; border-left: 4px solid var(--primary); display: flex; gap: 10px; font-weight: 500;}
        .set-row { display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 12px 0; border-bottom: 1px solid #2c2c2e; font-size: 16px; }
        .set-number { background: #2c2c2e; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--mut); text-align: center; width: max-content; }
        .set-weight { font-weight: 700; text-align: center; }
        .set-check { color: var(--sec); text-align: right; font-weight: bold;}
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #2c2c2e; padding-bottom: env(safe-area-inset-bottom, 15px); z-index: 50; }
        .nav-btn { background: transparent; color: var(--mut); margin: 0; flex: 1; padding: 16px 0; border: none; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px;}
        .nav-btn.active { color: var(--primary); }
        .dropdown { position: absolute; right: 0; top: 40px; background: #2c2c2e; border-radius: 12px; display: none; flex-direction: column; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 220px; overflow: hidden;}
        .dropdown button { background: transparent; color: white; padding: 16px; text-align: left; margin: 0; border-radius: 0; border-bottom: 1px solid #3a3a3c; font-size: 15px;}
        .active-workout-banner { background: rgba(78, 128, 238, 0.1); border: 1px solid var(--primary); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; display: none;}
        
        /* NOVO: Ajuste do Toast e do Banner de Descanso para não baterem no Notch */
        #toastContainer { position: fixed; top: calc(env(safe-area-inset-top, 45px) + 10px); left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: #2c2c2e; color: white; padding: 16px 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 12px; animation: slideDown 0.3s forwards; pointer-events: auto; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .ui-modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .ui-modal-box { background: var(--card); padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); transform: scale(0.95); animation: popIn 0.3s forwards; max-height: 80vh; overflow-y: auto;}
        @keyframes popIn { to { transform: scale(1); } }
        .ui-modal-title { font-size: 20px; font-weight: 800; margin: 0 0 10px 0; }
        .ui-modal-text { font-size: 15px; color: var(--mut); margin: 0 0 24px 0; line-height: 1.4; }
        .ui-modal-actions { display: flex; gap: 12px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; margin-bottom: 10px;}
        .cal-day-name { font-size: 12px; color: var(--mut); font-weight: 700; margin-bottom: 5px;}
        .cal-day { padding: 8px 0; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; background: #2c2c2e; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40px;}
        .cal-day.empty { background: transparent; cursor: default; }
        .cal-day.has-workout { background: rgba(78, 128, 238, 0.15); color: var(--primary); }
        .cal-dots { display: flex; gap: 4px; margin-top: 4px; height: 6px; }
        .cal-dot { width: 5px; height: 5px; background: var(--primary); border-radius: 50%; }
        
        #restTimerBanner { position: fixed; top: 0; left: 0; right: 0; background: var(--primary); color: white; padding: 15px; padding-top: calc(env(safe-area-inset-top, 45px) + 10px); display: none; justify-content: space-between; align-items: center; z-index: 100; font-weight: bold; font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: background 0.3s; }
    </style>
</head>
<body>

    <div id="toastContainer"></div>
    <div id="restTimerBanner">
        <span style="font-size: 20px;">⏱️</span>
        <span id="restTimerText">00:00</span>
        <button onclick="fecharRestTimer()" style="background: rgba(0,0,0,0.3); color: white; margin:0; padding: 6px 12px; width: auto; border-radius: 8px; font-size: 14px;">Saltar</button>
    </div>

    <!-- HOME -->
    <div id="screen-home" class="screen active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Treinos</h1>
            <button onclick="abrirCriadorTemplate()" class="btn-text" style="background: rgba(78, 128, 238, 0.15); border-radius: 10px;">+ Novo</button>
        </div>
        <div id="activeWorkoutBanner" class="active-workout-banner">
            <h3 style="margin: 0 0 8px 0; color: var(--primary);">Treino em Curso</h3>
            <p style="margin: 0 0 16px 0; font-size: 14px; color: var(--mut);">Tens um treino por terminar.</p>
            <div style="display: flex; gap: 10px;">
                <button onclick="retomarTreino()" class="btn-primary" style="margin: 0;">Retomar</button>
                <button onclick="apagarTreinoInterrompido()" class="btn-outline" style="border:none; background: #2c2c2e; color: #fff; margin: 0;">Descartar</button>
            </div>
        </div>
        <div id="templatesList"></div>
    </div>

    <!-- STATS -->
    <div id="screen-stats" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <button onclick="voltarHome()" class="btn-text" style="padding:0; margin-right: 15px;">&lt; Voltar</button>
            <h2 id="statsTitle" style="margin:0; font-size: 20px; text-align: center; flex: 1;">Estatísticas</h2>
            <div style="width: 60px;"></div>
        </div>
        <div class="card" style="padding: 25px 20px;">
            <p style="color: var(--mut); margin: 0 0 10px 0; font-size: 12px; font-weight: bold; text-transform: uppercase;">1. Escolher Exercício</p>
            <select id="statsExercicioSelect" onchange="atualizarGrafico()" style="margin-bottom: 20px; font-weight: bold;"></select>
            <p style="color: var(--mut); margin: 0 0 10px 0; font-size: 12px; font-weight: bold; text-transform: uppercase;">2. Métrica do Gráfico</p>
            <select id="statsMetricaSelect" onchange="atualizarGrafico()" style="margin-bottom: 30px; font-weight: bold; background: #1c1c1e; border: 1px solid #3a3a3c;">
                <option value="1rm">🔥 1RM Estimado (Peso + Reps)</option>
                <option value="max_weight">🏋️ Carga Máxima (Apenas Peso)</option>
                <option value="volume">📦 Volume de Treino (Peso x Reps)</option>
            </select>
            <h3 id="graficoTitulo" style="margin: 0 0 15px 0; color: white;">Progressão de Carga</h3>
            <div id="chartContainer" style="width: 100%; height: 250px; position: relative;"></div>
        </div>
    </div>

    <!-- CRIAR TEMPLATE -->
    <div id="screen-create" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Criar Rotina</h1>
            <button onclick="voltarHome()" class="btn-text" style="color: var(--danger); background: rgba(255, 69, 58, 0.15); border-radius: 10px;">Cancelar</button>
        </div>
        <div class="card">
            <input type="text" id="novoTemplateNome" placeholder="Nome do Treino (ex: Leg Day)" style="font-size: 18px; font-weight: bold; background: #000;">
            <h4 style="margin: 15px 0 10px 0; color: var(--mut);">Exercícios:</h4>
            <div id="listaExCriacao"></div>
            
            <div class="row" style="background: #000; padding: 12px; border-radius: 12px; margin-top: 15px; flex-wrap: wrap;">
                <input type="text" id="novoExNome" placeholder="Exercício" style="margin:0; background: #1c1c1e; flex: 1 1 100%;">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" inputmode="numeric" id="novoExSeries" placeholder="Séries" style="margin:0; flex: 1; background: #1c1c1e;">
                    <input type="text" inputmode="numeric" id="novoExDescanso" placeholder="Descanso (s)" style="margin:0; flex: 1; background: #1c1c1e;">
                    <button onclick="addExercicioAoTemplate()" class="btn-primary" style="width: 60px; margin: 0; font-size: 20px; padding: 12px;">+</button>
                </div>
            </div>
            
            <button onclick="guardarTemplate()" class="btn-primary" style="margin-top: 25px;">Gravar Rotina</button>
        </div>
    </div>

    <!-- LIVE MODE -->
    <div id="screen-live" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; position: relative;">
            <button onclick="cancelarTreinoSeguro()" class="btn-text" style="color: var(--danger); padding:0;">Sair</button>
            <div style="display: flex; flex-direction: column; align-items: center;">
                <h3 id="liveTitle" style="margin:0; font-size: 17px; font-weight: 700;">Treino</h3>
                <span id="workoutTimerDisplay" style="color: var(--sec); font-size: 14px; font-weight: bold; margin-top: 2px;">00:00</span>
            </div>
            <button onclick="toggleDropdown()" class="btn-text" style="color: white; font-size: 24px; padding: 0 10px;">⋮</button>
            
            <div id="liveDropdown" class="dropdown">
                <button onclick="abrirModalTrocar()">🔄 Trocar Máquina</button>
                <button onclick="finalizarTreino()" style="color: var(--sec);">💾 Gravar Alterações</button>
            </div>
        </div>
        <div id="liveExercises"></div>
    </div>

    <!-- HISTÓRICO -->
    <div id="screen-history" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin:0;">Histórico</h1>
            <div style="display: flex; background: #1c1c1e; border-radius: 10px; padding: 4px;">
                <button id="btnHistLista" onclick="setHistoricoModo('lista')" style="margin:0; padding: 6px 12px; background: var(--primary); color: white; font-size: 13px; border-radius: 8px;">Lista</button>
                <button id="btnHistCal" onclick="setHistoricoModo('calendario')" style="margin:0; padding: 6px 12px; background: transparent; color: var(--mut); font-size: 13px; border-radius: 8px;">Calendário</button>
            </div>
        </div>
        <div id="viewHistoricoLista"></div>
        <div id="viewHistoricoCal" style="display: none;">
            <div class="card">
                <div class="calendar-header">
                    <button class="btn-text" onclick="mudarMes(-1)">&lt;</button>
                    <h3 id="calMesAno" style="margin:0; font-size: 16px;">Mês Ano</h3>
                    <button class="btn-text" onclick="mudarMes(1)">&gt;</button>
                </div>
                <div class="calendar-grid"><div class="cal-day-name">D</div><div class="cal-day-name">S</div><div class="cal-day-name">T</div><div class="cal-day-name">Q</div><div
